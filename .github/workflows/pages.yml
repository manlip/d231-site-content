name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir _site
          for path in index.html assets css data js pages widgets embed_snippet; do
            if [ -e "$path" ]; then
              cp -R "$path" _site/
            fi
          done
      - name: Install PDF thumbnail renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Generate newsletter thumbnails
        run: node scripts/generate-newsletter-thumbnails.cjs _site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
