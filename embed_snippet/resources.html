<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Resource Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/resources.css">
</head>
<body>

<div id="stale-notice" class="stale-notice">Could not refresh. Showing saved data.</div>

<div id="search-wrap" class="search-wrap" hidden>
    <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="resource-search" type="search" placeholder="Search resources..." aria-label="Search resources" autocomplete="off">
</div>

<!-- Target insertion element for the accordion -->
<div id="accordion-container">
    <div class="skeleton" aria-label="Loading"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>
<div id="no-results" class="no-results" hidden>No resources match your search.</div>

<!-- Popup modal -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modal-title">Resource Title</h2>
            <button class="modal-close" aria-label="Close" onclick="closeModal(null)">&times;</button>
        </div>
        <div id="modal-body" class="modal-body" tabindex="0"></div>
        <div id="modal-footer" class="modal-footer" hidden></div>
    </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/markdown.js"></script>
<script src="../js/resources-loader.js"></script>
</body>
</html>
